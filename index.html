<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Multiple Modes</title>
    <script src="https://kit.fontawesome.com/e0b303a9da.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="logo">⚡Code with Abhi⚡</div>
    <h1>Tic Tac Toe</h1>
    <div id="controls">
        <button onclick="setMode('easy')" id="easy">Easy</button>
        <button onclick="setMode('normal')" id="normal">Normal</button>
        <button onclick="setMode('hard')" id="hard">Hard</button>
        <button onclick="setMode('multiplayer')" id="multiplayer"><i class="fa-solid fa-mars-double"> </i> Multiplayer</button>
    </div>
    <div id="game">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <h2 id="modalMessage"></h2>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>
    <div class="game">

        <button onclick="resetGame()" id="reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
